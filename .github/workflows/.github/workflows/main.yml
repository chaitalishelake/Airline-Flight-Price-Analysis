
name: Airline ML CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: pip install -r requirements.txt

      - name: Check Python Syntax
        run: python -m py_compile airline_analysis.py train.py

      - name: Verify Dataset
        run: test -f airlines_flights_data.csv

      - name: Complete
        run: echo "Airline ML Pipeline completed successfully!"
